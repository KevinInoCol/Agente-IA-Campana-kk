# Configuración del LLM del agente.
# agent.py construye el modelo con init_chat_model("<provider>:<model>", ...).

provider: openai        # Proveedor del modelo
model: gpt-5.6-sol      # Desde 2026-10-24 (pedido del usuario). Comparado en la misma conversación
                        # con gpt-4.1, gpt-5.1, gpt-5.5, gpt-5.4-mini y gpt-5.6-luna/terra: sol y terra
                        # fueron los únicos sin errores de navegación (gpt-4.1 resolvía un "6" del
                        # menú de Valores con la numeración del principal). ~1,8 s por respuesta.
reasoning_effort: none  # Sin razonamiento: respuestas en ~2 s, como un modelo de chat. Los GPT-5
                        # no aceptan `temperature` (por eso ya no está aquí).
max_tokens: 600         # Los mensajes del guion son de 3-4 líneas; 600 deja margen sin permitir respuestas largas
